name: Build Painuzz
on:
  push: { branches: [ main, master ] }
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu 24.04 fix)
        run: |
          sudo apt-get update
          # Cài đặt libtinfo5 từ kho lưu trữ cũ (bắt buộc cho Theos)
          wget https://mirrors.edge.kernel.org/ubuntu/pool/universe/n/ncurses/libtinfo5_6.3-2ubuntu0.1_amd64.deb
          echo "f04c382f877c9eab631818eadbfaa0c5 libtinfo5_6.3-2ubuntu0.1_amd64.deb" | md5sum -c --status
          sudo dpkg -i libtinfo5_6.3-2ubuntu0.1_amd64.deb
          
          # Cài đặt các gói phụ thuộc còn lại (đã sửa lỗi libxml2)
          sudo apt-get install -y \
            git make curl xz-utils unzip \
            clang lld llvm \
            libssl-dev libxml2-dev libplist-dev libpng-dev \
            zlib1g-dev libncurses6 libtinfo6 \
            build-essential fakeroot dpkg-dev

      - name: Install ldid
        run: |
          git clone --depth=1 https://github.com/ProcursusTeam/ldid.git /tmp/ldid
          cd /tmp/ldid
          git submodule update --init
          make CXX=clang++
          sudo cp ./ldid /usr/local/bin/ldid
          sudo chmod +x /usr/local/bin/ldid

      - name: Setup Theos
        run: |
          export THEOS=$HOME/theos
          git clone --recursive --depth=1 https://github.com/theos/theos.git $THEOS
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH

      - name: Download iOS SDKs
        run: |
          mkdir -p $THEOS/sdks
          curl -L https://github.com/theos/sdks/archive/refs/heads/master.tar.gz | tar xz -C /tmp
          mv /tmp/sdks-master/*.sdk $THEOS/sdks/
          ls $THEOS/sdks

      - name: Build package
        run: |
          make clean || true
          make package FINALPACKAGE=1 DEBUG=0

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Painuzz-deb
          path: packages/*.deb
          retention-days: 30